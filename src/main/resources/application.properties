quarkus.aesh.top-command=io.litoria.LitoriaCommand
quarkus.qute.template-path-exclude=.*\\.(jpg|png|gif|ico|svg|css|woff|woff2|ttf|eot|md)

# Logging
%dev.quarkus.log.console.color=true
quarkus.log.category."io.vertx.ext.mail".level=INFO
quarkus.log.category."com.openhtmltopdf".level=ERROR

# SMTP (Quarkus Mailer)
quarkus.mailer.host=${LITORIA_SMTP_HOST:smtp.gmail.com}
quarkus.mailer.port=${LITORIA_SMTP_PORT:587}
quarkus.mailer.start-tls=REQUIRED
# Must be the email address used to create the OAuth2 Client ID
quarkus.mailer.username=${LITORIA_SMTP_USER:}

# The password is only needed when Oauth2 is not used
quarkus.mailer.password=${LITORIA_SMTP_PASS:}

# Generator
litoria.generator.engine=markdown
litoria.generator.source=./source
litoria.generator.destination=generated
litoria.generator.image=${litoria.generator.source}/image
litoria.generator.footer=true
litoria.generator.footer-text=Generated by <a href="https://github.com/ch007m/litoria-quarkus">litoria</a>

# OAuth2 authentication (alternative to username/password)
litoria.smtp.oauth2.client-id=${LITORIA_SMTP_OAUTH2_CLIENT_ID:}
litoria.smtp.oauth2.client-secret=${LITORIA_SMTP_OAUTH2_CLIENT_SECRET:}
litoria.smtp.oauth2.refresh-token=${LITORIA_SMTP_OAUTH2_REFRESH_TOKEN:}

# Asciidoctor
litoria.asciidoctor.attributes.showtitle=true
litoria.asciidoctor.attributes.nofooter=yes
litoria.asciidoctor.attributes.icons=font
litoria.asciidoctor.options.doctype=article
litoria.asciidoctor.options.safe=unsafe
