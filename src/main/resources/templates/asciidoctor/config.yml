generator:
  engine: "asciidoctor"
  source: "./source"
  destination: "generated"
  image: "${source}/image" # path to the images directory used to resolve and embed images during generation

report:
  author: # your First & Last Name
  title:  # your company title
  email:  # your email address
  # date is auto-filled with today's date if not set
  signature: "Cheers{break}----{break}{author}{break}{title}"

  mail:
    from: "{email}"
    to: "user@domain"
    subject: "{author}'s weekly report : {date}"

asciidoctor:
  attributes:
    showtitle: ''
    stylesheet: 'foundation.css'
    stylesdir: 'css'
    nofooter: 'yes'
    icons: 'font'
  options:
    doctype: 'article'
    safe: 'unsafe'

pdf:
  format: A4
  orientation: portrait
  zoomFactor: "0.55"
  border:
    top: 20px
    right: 15px
    bottom: 20px
    left: 15px

