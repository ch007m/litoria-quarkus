generator:
  source: "./source" # directory path or name of the file to be processed
  destination: "generated"
  image: "${source}/image" # path to the images directory used to resolve and embed images during generation

  metadata:
    author: "First & Last Name"
    email: "user@domain"
    # date is auto-filled with today's date if not set

asciidoctor:
  attributes:
    showtitle: ''
    stylesheet: 'foundation.css'
    stylesdir: 'css'
    nofooter: 'yes'
  options:
    doctype: 'article'
    safe: 'unsafe'

pdf:
  format: A4
  orientation: portrait
  zoomFactor: "0.55"
  border:
    top: 20px
    right: 15px
    bottom: 20px
    left: 15px

