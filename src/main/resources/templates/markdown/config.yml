generator:
  engine: "markdown"
  source: "./source"
  destination: "generated"
  image: "${source}/image" # path to images directory, used by --embed to resolve and inline images
  # css: "./source/css/custom.css" # optional: path to a custom CSS file

report:
  author: # your First & Last Name
  title:  # your company title
  email:  # your email address
  # date is auto-filled with today's date if not set
  signature: "Cheers{break}----{break}{author}{break}{title}"

  mail:
    from: "{email}"
    to: # quarkus-status@redhat.com
    subject: "{author}'s weekly report : {date}"

# SMTP configuration (used by the 'send' command)
