name: Deploy docs to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build litoria uber-jar
        run: ./mvnw package -DskipTests --no-transfer-progress

      - name: Generate docs with litoria
        run: |
          java -jar target/litoria-quarkus-1.0.0-SNAPSHOT-runner.jar \
            generate --engine asciidoctor -d site docs

      - name: Copy static files
        run: cp docs/slides-tokens.html docs/site/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
