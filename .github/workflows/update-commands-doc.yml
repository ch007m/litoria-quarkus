name: Update commands documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'src/main/java/io/litoria/command/**'
      - 'src/main/java/io/litoria/LitoriaCommand.java'

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build uber-jar
        run: ./mvnw package -DskipTests --no-transfer-progress

      - name: Generate commands documentation
        run: .github/scripts/generate-commands-doc.sh

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet docs/commands.md || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs: update commands.md from CLI help"
          title: "docs: update commands.md"
          body: |
            Auto-generated from `litoria --help=md`.

            Triggered by changes to command definitions.
          branch: docs/update-commands
          delete-branch: true
